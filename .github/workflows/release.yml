
name: Publicar DBD Build Companion

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validar versão e configuração pública da release
        run: node scripts/check-release.mjs --production
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Impedir substituição ou duplicação de uma release existente
        uses: actions/github-script@v7
        with:
          script: |
            const version = require('./package.json').version;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            if (releases.some(release => release.tag_name === `v${version}`)) {
              core.setFailed(`A versão v${version} já tem release ou rascunho. Prepare uma nova versão.`);
            }

      - name: Instalar dependencias
        run: npm ci

      - name: Testar projeto
        run: npm test

      - name: Verificar imagens locais
        run: node scripts/check-assets.mjs

      - name: Testar interface e imagens empacotadas
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui
        env:
          DBC_STATIC_TEST: '1'
          VITE_SUPABASE_URL: https://dbc-test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_fixture

      - name: Gerar instalador em rascunho
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          tagName: v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseName: DBD Build Companion v__VERSION__
          releaseBody: 'Seleção em massa de killers e perks e login persistente. Instalador compilado deste commit; consulte docs/RELEASE-0.4.0.md para validação e teste de login no Windows.'
          args: -- --locked
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
