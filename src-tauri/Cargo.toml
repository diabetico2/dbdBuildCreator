[package]
name = "dbd-build-companion"
version = "0.3.1"
description = "Companheiro independente de builds de DBD"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
